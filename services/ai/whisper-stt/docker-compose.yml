services:
  whisper-stt:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    container_name: whisper-stt
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - WHISPER__COMPUTE_TYPE=int8   # cuts RAM use ~40% on CPU
      - WHISPER__INFERENCE_DEVICE=cpu
      - STT_MODEL_TTL=300            # unload after 5 min idle — same idea as OLLAMA_KEEP_ALIVE
    volumes:
      - whisper-cache:/home/ubuntu/.cache/huggingface/hub

volumes:
  whisper-cache: