name: "dashboard"

services:

####################
# Dashboard
####################

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage

    networks:
      - default

    ports:
      - ${PORT_DASH_HTTP}:3000

    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      LOG_LEVEL: 'debug'
      HOMEPAGE_ALLOWED_HOSTS: ${SERVER_URL}:${PORT_DASH_HTTP},${HOST_NAME}.${HOST_DOMAIN}:${PORT_DASH_HTTP},${INTERNAL_HOMEPAGE}.${HOST_DOMAIN}

    volumes:
      - ${CONFIGDIR}/homepage:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /mnt/seagate_storage:/mnt/seagate_storage:ro
    
    healthcheck:
      test: wget --spider http://${SERVER_URL}:${PORT_SOCKY_PROXY}/version || exit 1
      interval: "180s"
      timeout: "5s"
      retries: 3
      start_period: "30s"

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    restart: unless-stopped


networks:
  default:
    name: homelab-network
    