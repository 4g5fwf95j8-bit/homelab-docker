#
# WARNING: To install Immich, follow our guide: https://immich.app/docs/install/docker-compose
#
# Make sure to use the docker-compose.yml of the current release:
#
# https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# The compose file on main may not be compatible with the latest release.

name: immich

services:
  immich_server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-release}

    depends_on:
      immich_redis:
        condition: service_started
      immich_postgres:
        condition: service_started
        restart: true

    ports:
      - 127.0.0.1:${PORT_IMMICH}:2283

    extends:
      file: staticconfig/immich-server/hwaccel.transcoding.yml
      service: quicksync # set to one of [nvenc, quicksync, rkmpp, vaapi, vaapi-wsl] for accelerated transcoding

    environment:
      TZ: ${TZ}

      DB_HOSTNAME: immich_postgres
      DB_PASSWORD: ${IMMICH_DB_PASSWORD}
      DB_USERNAME: ${IMMICH_DB_USERNAME}
      DB_DATABASE_NAME: ${IMMICH_DB_NAME}

      REDIS_HOSTNAME: immich_redis
    
    volumes:
      # https://docs.immich.app/guides/custom-locations/
      - ${DIR_PHOTOS}:/data
      - ${DIR_PHOTOS_THUMBS}:/data/thumbs

      # :/data/profile
      - /etc/localtime:/etc/localtime:ro

    healthcheck:
      disable: false
    restart: unless-stopped


  immich_machine_learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-release}

    environment:
      TZ: ${TZ}

    volumes:
      - model-cache:/cache

    healthcheck:
      disable: false
    restart: unless-stopped

  immich_redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:3b55fbaa0cd93cf0d9d961f405e4dfcc70efe325e2d84da207a0a8e6d8fde4f9
    
    healthcheck:
      test: redis-cli ping || exit 1

    restart: unless-stopped


  immich_postgres:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23

    shm_size: 128mb

    environment:
      POSTGRES_PASSWORD: ${IMMICH_DB_PASSWORD}
      POSTGRES_USER: ${IMMICH_DB_USERNAME}
      POSTGRES_DB: ${IMMICH_DB_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'

    volumes:
      # Do not edit the next line. If you want to change the database storage location on your system, edit the value of DB_DATA_LOCATION in the .env file
      - ${DBDIR}/immich:/var/lib/postgresql/data # TODO this needs migrated to DIR_DB. I have to migrate existing data though
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IMMICH_DB_USERNAME} -d ${IMMICH_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped


volumes:
  model-cache:
  