---
allowedHosts:
  - localhost
  - 127.0.0.1
  - homepage
  - homepage.gsofianos.duckdns.org
title: Sofianos Server Dashboard
header: true
headerStyle: boxedWidgets
footer: false
cardBlur: xs
fullWidth: false
useEqualHeights: true
theme: dark
color: slate
disableCollapse: true
bookmarksStyle: icons
showStats: true
disableIndexing: true

layout:
  Main Container:
    header: false
    style: row
    columns: 4

    Filler1:
      header: false
      style: markdown
      content: ""

    Media:
      header: true
      Media-Main:
        header: false
      Immich-More:
        header: false
        style: row
        columns: 2

    Tools Container:
      header: false

      AI Tools:
        header: true

      Apps Container:
        header: false
        style: row

        Apps:
          header: true
          style: row
          columns: 2

    Filler2:
      header: false
      style: markdown
      content: ""
