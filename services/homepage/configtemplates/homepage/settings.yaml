---
allowedHosts:
  - localhost
  - 127.0.0.1
  - homepage
  - homepage.gsofianos.duckdns.org
title: Sofianos Server Dashboard
header: true
headerStyle: boxedWidgets
footer: false
cardBlur: xs
fullWidth: false
useEqualHeights: true
theme: dark
color: slate
disableCollapse: true
bookmarksStyle: icons
showStats: true
statusStyle: "dot"
disableIndexing: true

layout:
  Main Container:
    header: false
    style: row
    columns: 4

    Media:
      header: true
      # default style is column → items stack vertically
      Media-Main:
        header: false
        # default column → Jellyfin + Immich stack on top of each other
      Immich-More:
        header: false
        style: row
        columns: 2          # ← this creates the 2×2 quadrant

    AI Tools:
      header: true
      # default column → Open WebUI + Ollama stack

    Apps:
      header: true
      # default column → Pricebuddy, Receipt Tracker, etc. stack

    Host Nodes:
      header: true
      # default column → Media Server + AI Server stack