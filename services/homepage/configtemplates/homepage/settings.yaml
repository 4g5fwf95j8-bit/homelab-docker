---
allowedHosts:
  - localhost
  - 127.0.0.1
  - homepage
  - homepage.gsofianos.duckdns.org

title: Sofianos Server Dashboard
header: true
headerStyle: boxedWidgets
footer: false
cardBlur: xs
fullWidth: false
useEqualHeights: true
theme: dark
color: slate
disableCollapse: true
bookmarksStyle: icons
showStats: true
statusStyle: "dot"

layout:
  Media:
    style: row
    columns: 2
  AI Tools:
    style: row
    columns: 2
  Apps:
    style: row
    columns: 4
  Host Nodes:
    style: boxedWidgets
    columns: 2
