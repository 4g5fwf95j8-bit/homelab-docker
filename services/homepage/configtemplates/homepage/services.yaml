- Main Container:
    - Media:
        - Media-Main:
            - Jellyfin:
                icon: jellyfin
                href: https://jellyfin.gsofianos.duckdns.org
                description: Media Server
                server: homelab-media
                container: jellyfin
                showStats: true
                siteMonitor: https://jellyfin.gsofianos.duckdns.org
                widget:
                  type: jellyfin
                  url: https://jellyfin.gsofianos.duckdns.org
                  key: 28e35cc8dad846d584ef8b6292f55d6b
                  enableBlocks: true
                  enableNowPlaying: true
                  enableUser: true
                  showEpisodeNumber: true
                  expandOneStreamToTwoRows: false
            - Immich:
                icon: immich
                href: https://immich.gsofianos.duckdns.org
                description: Photo Library
                server: homelab-media
                container: immich_server
                showStats: true
                siteMonitor: https://immich.gsofianos.duckdns.org
                widget:
                  type: immich
                  url: https://immich.gsofianos.duckdns.org
                  key: 0dxTMLWosWGHuB7v47oRCWFbS6THliOeWyLErDM
                  version: 2
        - Immich-More:
            - immich_server:
                icon: immich-public-proxy
                server: homelab-media
                container: immich_server
            - immich_postgress:
                icon: postgres
                server: homelab-media
                container: immich_postgress
            - immich_machine_leadning:
                icon: mdi-brain
            - immich_redis:
                icon: redis
                server: homelab-media
                container: immich_redis

    - AI Tools:
        - Open WebUI:
            icon: open-webui
            href: https://ai.gsofianos.duckdns.org
            description: Local LLM Interface
            server: homelab-ai
            container: open-webui
            showStats: true
            siteMonitor: http://100.71.98.85:8080
        - Ollama:
            icon: ollama
            href: http://100.71.98.85:11434
            description: Local LLM Engine
            server: homelab-ai
            container: ollama
            showStats: true
            siteMonitor: http://100.71.98.85:11434
            widget:
              type: customapi
              url: http://100.71.98.85:11434/api/tags
              mappings:
                - field: models
                  label: Installed Models
                  format: size

    - Apps:
        - Pricebuddy:
            icon: https://raw.githubusercontent.com/jez500/pricebuddy/main/public/favicon.ico
            href: https://pricebuddy.gsofianos.duckdns.org
            description: Price Tracking
            server: homelab-media
            container: pricebuddy
            showStats: true
            siteMonitor: https://pricebuddy.gsofianos.duckdns.org
        - Receipt Tracker:
            icon: mdi-receipt-text-outline
            description: Grocery Spend Tracker
            server: homelab-ai
            container: receipt-api
            showStats: true
        - Pricecheck:
            icon: mdi-barcode-scan
            description: Barcode Price Lookup
            server: homelab-media
            container: pricecheck
            showStats: true
        - Grafana:
            icon: grafana
            href: https://grafana.gsofianos.duckdns.org
            description: Metrics Dashboard
            server: homelab-ai
            container: grafana
            showStats: true
            siteMonitor: https://grafana.gsofianos.duckdns.org

    - Host Nodes:
        - Media Server:
            icon: mdi-play-network
            description: Primary Storage & Media Host
            server: homelab-media
            ping: 192.168.68.130
            container: homepage
        - AI Server:
            icon: mdi-cloud-check-variant
            description: Ollama & AI Inference Host
            server: homelab-ai
            ping: 100.71.98.85
            container: dockerproxy